# Only the differences from the SearXNG defaults.
use_default_settings: true

general:
  instance_name: "SearXNG"

search:
  safe_search: 0
  autocomplete: ""
  # pi-web-access reads the JSON API.
  formats:
    - html
    - json

server:
  # Overwritten by SEARXNG_SECRET from .env.
  secret_key: "ultrasecretkey"
  # Private loopback instance: no bot limiter, so no valkey.
  limiter: false
  public_instance: false
  image_proxy: false
