; llama-server router presets. The section name is the model id clients send.
; Keys are llama-server flags without the leading dashes.
version = 1

[*]
n-gpu-layers = 99
parallel = 1
temp = 0.1
top-k = 50
repeat-penalty = 1.1
dedup-cache-models = true

; Agents and tools (pi, opencode). 128K, half the trained maximum: recall
; already drops at 128K (RULER 128K 65.56 on the model card) and decode
; slows as the context grows, so the harness compacts before that.
; The thinking of every turn stays in context during a task.
; It always reasons (ignores reasoning off), so cap its thinking per request:
; unbounded reasoning on agent prompts stalls the slot.
; Sampling (temp, top-k, repeat-penalty in [*]) is the card's general preset.
[lfm3-1.7b]
hf = LiquidAI/LFM3-1.7B-GGUF:Q8_0
ctx-size = 131072
reasoning-budget = 10000
reasoning-budget-message = Tiempo de razonamiento agotado. Ejecutá el próximo paso ahora.

; Text, image, audio, video. Non-reasoning model. 64k: its 128k maximum
; leaves almost no free VRAM.
[lfm3-omni]
hf = LiquidAI/LFM3-Omni-2B-GGUF:Q8_0
ctx-size = 65536
reasoning = off
