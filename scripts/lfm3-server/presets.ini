; llama-server router presets. The section name is the model id clients send.
; Keys are llama-server flags without the leading dashes.
version = 1

[*]
n-gpu-layers = 99
parallel = 1
temp = 0.1
top-k = 50
repeat-penalty = 1.1
dedup-cache-models = true

; Coding/agents (opencode). Trained maximum context (~6.4 GB of VRAM).
; It always reasons (ignores reasoning off), so cap its thinking: unbounded
; reasoning on agent prompts stalls the slot.
[lfm3-1.7b]
hf = LiquidAI/LFM3-1.7B-GGUF:Q8_0
ctx-size = 262144
reasoning-budget = 1024

; Text, image, audio, video. Non-reasoning model. 64k: its 128k maximum
; leaves almost no free VRAM.
[lfm3-omni]
hf = LiquidAI/LFM3-Omni-2B-GGUF:Q8_0
ctx-size = 65536
reasoning = off
