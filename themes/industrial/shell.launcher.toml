# DESIGN.md §5.8 and §5.13: an opaque --panel with a 1 px --line border over an
# 80 % --void scrim. The selected row is an inversion: --blue-500 fill with
# --void text.
[launcher]
background                = "#0d1112"
background-alpha          = 1.0
text                      = "#f4f8f8"
border                    = "#676b6c"
border-alpha              = 1.0
border-width              = 1
scrim                     = "#080c0d"
scrim-alpha               = 0.8
selected-background       = "#def85d"
selected-background-alpha = 1.0
selected-text             = "#080c0d"
selected-border           = "#def85d"
selected-border-alpha     = 0
