# Industrial: the tokens of DESIGN.md §3.1 mapped onto Omarchy's palette.
# Greys are neutral (chroma 0). The only hues are DESIGN.md's two signals,
# --red-600 for errors and --amber-500 for progress and warnings (§3.2).
# Blue, the usual accent slot, takes --accent: white marks selection, links
# and focus.
#
# Every text colour keeps 4.5:1 or more on --void (DESIGN.md §3.3), so nothing
# here is darker than --ink-500 except brown and muted, which carry no readings.
#
#   #1f1f1f --void         background, and both darker shades: §3.7 forbids
#                          anything darker than the canvas
#   #262626 --panel        lighter_background
#   #3a3a3a --ink-900      selection (Neovim Visual, LSP references)
#   #4a4a4a --line         selection_background, inactive window border
#   #707070 --ink-700      muted (comments, ghost text), brown
#   #9a9a9a --ink-500      dark_foreground
#   #b0b0b0 --ink-300      light_foreground, green, cyan
#   #c8c8c8 --accent-press magenta
#   #d4d4d4 --ink-100      foreground
#   #ffffff --accent       accent, cursor, blue
#   #e96d66 --red-600      red
#   #d9974a --amber-500    yellow, orange
#
# selection_background is --line and not a white inversion: VS Code and
# Obsidian lay unchanged --ink-100 text over it, which a white fill hides.
mode = "dark"

accent = "#ffffff"
selection = "#3a3a3a"
muted = "#707070"

background = "#1f1f1f"
dark_background = "#1f1f1f"
darker_background = "#1f1f1f"
lighter_background = "#262626"

foreground = "#d4d4d4"
dark_foreground = "#9a9a9a"
light_foreground = "#b0b0b0"
bright_foreground = "#ffffff"

selection_background = "#4a4a4a"
selection_foreground = "#ffffff"

red = "#e96d66"
yellow = "#d9974a"
orange = "#d9974a"
green = "#b0b0b0"
cyan = "#b0b0b0"
blue = "#ffffff"
magenta = "#c8c8c8"
brown = "#707070"

bright_red = "#e96d66"
bright_yellow = "#d9974a"
bright_green = "#d4d4d4"
bright_cyan = "#c8c8c8"
bright_blue = "#ffffff"
bright_magenta = "#d4d4d4"

hyprland_inactive_border = "#4a4a4a"
