# DESIGN.md §5.13: a floating --panel with a 1 px --line border over the 80 %
# --void scrim. The primary action is --blue-500; a failed attempt turns the
# border --red-600 and leaves the message in --ink-100 (§3.3).
[polkit]
background       = "#0d1112"
background-alpha = 1.0
text             = "#f4f8f8"
text-error       = "#f4f8f8"
border           = "#676b6c"
border-error     = "#ef4c42"
border-alpha     = 1.0
scrim            = "#080c0d"
scrim-alpha      = 0.8
accent           = "#def85d"
