# Token Meridian (light, "Warm Parchment"). Surfaces come from the Token
# palette's bg0..bg5 and fg0..fg3; every ANSI slot comes from
# contrib/ghostty/token-meridian-light, so waybar, btop and the rest match the
# terminal instead of drifting from it.
